<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>

<style>
body { font-family: Arial; margin: 0; display: flex; }

.menu {
  width: 200px;
  background: #0d2b4d;
  color: white;
  padding: 10px;
}

.menu button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  border: none;
  background: #1c4d80;
  color: white;
  cursor: pointer;
}

.menu button:hover {
  background: #ff7a00;
}

.conteudo {
  flex: 1;
  padding: 20px;
}
</style>

</head>
<body>

<div class="menu">
  <button onclick="abrir('dashboard')">Dashboard</button>
  <button onclick="abrir('produtos')">Produtos</button>
  <button onclick="abrir('categorias')">Categorias</button>
  <button onclick="abrir('pedidos')">Pedidos</button>
  <button onclick="abrir('loja')">Minha loja</button>
</div>

<div class="conteudo" id="conteudo">
  <h2>Dashboard</h2>
</div>

<script>

const API = "https://delivery-saas-production-caba.up.railway.app";

function abrir(tela) {

  if (tela === "dashboard") {
    document.getElementById("conteudo").innerHTML = `
      <h2>Dashboard</h2>
      <p>Bem vindo ao painel</p>
    `;
  }

  if (tela === "produtos") {
    carregarProdutos();
  }

  if (tela === "categorias") {
    document.getElementById("conteudo").innerHTML = `
      <h2>Categorias</h2>
      <p>Em breve</p>
    `;
  }

  if (tela === "pedidos") {
    carregarPedidos();
  }

  if (tela === "loja") {
    carregarLoja();
  }
}

// PRODUTOS
async function carregarProdutos() {
  const res = await fetch(API + "/produtos");
  const dados = await res.json();

  let html = "<h2>Produtos</h2>";

  dados.forEach(p => {
    html += `<p>${p.nome} - R$ ${p.preco}</p>`;
  });

  document.getElementById("conteudo").innerHTML = html;
}

// PEDIDOS
async function carregarPedidos() {
  const res = await fetch(API + "/pedidos");
  const dados = await res.json();

  let html = "<h2>Pedidos</h2>";

  dados.forEach(p => {
    html += `<p>Pedido #${p.id} - ${p.nome}</p>`;
  });

  document.getElementById("conteudo").innerHTML = html;
}

// LOJA
async function carregarLoja() {
  const res = await fetch(API + "/empresa");
  const dados = await res.json();

  document.getElementById("conteudo").innerHTML = `
    <h2>Minha Loja</h2>
    <p>${dados.nome}</p>
  `;
}

</script>

</body>
</html>
