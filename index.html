<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cardápio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #ff5a00;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .produto {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: #ff5a00;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .carrinho {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .finalizar {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h2 id="nomeLoja">Carregando...</h2>
    </div>

    <div id="produtos"></div>

    <div class="carrinho">
      <h3>Carrinho</h3>
      <div id="listaCarrinho"></div>
      <p><strong>Total: R$ <span id="total">0.00</span></strong></p>

      <input id="nome" placeholder="Seu nome">
      <input id="whatsapp" placeholder="WhatsApp">
      <input id="endereco" placeholder="Endereço">

      <button class="finalizar" onclick="finalizarPedido()">
        Finalizar Pedido
      </button>
    </div>

  </div>

<script>
const API = "https://delivery-saas-production-caba.up.railway.app";

// pega o slug da URL
const slug = window.location.pathname.split("/").pop() || "super-feliz";

let carrinho = [];

async function carregar() {
  const res = await fetch(`${API}/produtos/${slug}`);
  const data = await res.json();

  document.getElementById("nomeLoja").innerText = data.empresa.nome;

  const container = document.getElementById("produtos");
  container.innerHTML = "";

  data.produtos.forEach(p => {
    const div = document.createElement("div");
    div.className = "produto";

    div.innerHTML = `
      <div>
        <strong>${p.nome}</strong><br>
        R$ ${Number(p.preco).toFixed(2).replace(".", ",")}
      </div>
      <button class="btn" onclick="add(${p.id}, '${p.nome}', ${p.preco})">
        +
      </button>
    `;

    container.appendChild(div);
  });
}

function add(id, nome, preco) {
  const item = carrinho.find(i => i.id === id);

  if (item) {
    item.qtd++;
  } else {
    carrinho.push({ id, nome, preco, qtd: 1 });
  }

  renderCarrinho();
}

function renderCarrinho() {
  const lista = document.getElementById("listaCarrinho");
  lista.innerHTML = "";

  let total = 0;

  carrinho.forEach(item => {
    total += item.preco * item.qtd;

    const div = document.createElement("div");
    div.innerText = `${item.qtd}x ${item.nome}`;
    lista.appendChild(div);
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

async function finalizarPedido() {
  const nome = document.getElementById("nome").value;
  const whatsapp = document.getElementById("whatsapp").value;
  const endereco = document.getElementById("endereco").value;

  const total = carrinho.reduce((s, i) => s + i.preco * i.qtd, 0);

  const res = await fetch(`${API}/pedido/${slug}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      nome,
      whatsapp,
      endereco,
      itens: carrinho,
      total
    })
  });

  const data = await res.json();

  window.open(data.whatsapp, "_blank");
}

carregar();
</script>

</body>
</html>
